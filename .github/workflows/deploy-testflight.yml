name: Deploy to TestFlight

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build iOS & Upload to TestFlight
    # App Store Connect requires iOS 26 SDK (Xcode 26+); macos-14 only has Xcode 15.x.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Show Xcode / SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Point Rust at whatever clang_rt.ios the selected Xcode ships.
      - name: Configure Rust iOS linker paths
        run: |
          CLANG_LIB="$(ls -d "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/"*/lib/darwin 2>/dev/null | sort -V | tail -1)"
          if [ -z "$CLANG_LIB" ]; then
            echo "Could not find Xcode clang darwin lib dir"
            exit 1
          fi
          echo "Using clang darwin libs at: $CLANG_LIB"
          mkdir -p src-tauri/.cargo
          {
            echo "[target.aarch64-apple-ios]"
            echo "rustflags = [\"-C\", \"link-arg=-L${CLANG_LIB}\"]"
            echo
            echo "[target.aarch64-apple-ios-sim]"
            echo "rustflags = [\"-C\", \"link-arg=-L${CLANG_LIB}\"]"
            echo
            echo "[target.x86_64-apple-ios]"
            echo "rustflags = [\"-C\", \"link-arg=-L${CLANG_LIB}\"]"
          } > src-tauri/.cargo/config.toml

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          keychain-password: ${{ github.run_id }}

      - name: Install Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_TMP="$(mktemp)"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_TMP"
          UUID="$(security cms -D -i "$PROFILE_TMP" | plutil -extract UUID raw -)"
          cp "$PROFILE_TMP" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "Installed provisioning profile UUID=$UUID"
          rm -f "$PROFILE_TMP"

      - name: Create .env
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}"
          } > .env

      - name: Place App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Sync native bridges into Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          APPLE="src-tauri/gen/apple"
          for f in HealthKitBridge.swift LocationTrackingBridge.swift HRMBridge.swift AdBannerBridge.swift IapBridge.swift; do
            cp "src-tauri/Sources/$f" "$APPLE/$f"
          done
          # xcodegen ≥2.46 requires listed source paths to exist.
          mkdir -p "$APPLE/Externals" "$APPLE/assets"
          BUILD_NUM=${{ github.run_number }}
          sed -i '' "s/CFBundleVersion: .*/CFBundleVersion: \"$BUILD_NUM\"/" "$APPLE/project.yml"
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"$BUILD_NUM\"/" "$APPLE/project.yml"
          cd "$APPLE"
          env -u FORCE_COLOR xcodegen generate
          # Confirm bridges are compile sources (guards against another silent drop).
          if ! grep -q 'HealthKitBridge.swift in Sources' run-with-friends.xcodeproj/project.pbxproj; then
            echo "error: HealthKitBridge.swift missing from Xcode Sources after xcodegen"
            exit 1
          fi
          PLIST="run-with-friends_iOS/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion string $BUILD_NUM" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUM" "$PLIST"
          echo "BUILD_NUMBER=$BUILD_NUM" >> "$GITHUB_ENV"
          echo "Stamped CFBundleVersion=$BUILD_NUM"

      - name: Install CocoaPods dependencies
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            gem install cocoapods --user-install
            POD_BIN="$(ls -d "$HOME"/.local/share/gem/ruby/*/bin/pod 2>/dev/null | sort -V | tail -1 || true)"
            if [ -n "$POD_BIN" ]; then
              echo "$(dirname "$POD_BIN")" >> "$GITHUB_PATH"
            fi
          fi
          cd src-tauri/gen/apple
          pod install
          echo "---- Pods OTHER_LDFLAGS (must not contain -ObjC) ----"
          rg -n "OTHER_LDFLAGS" "Pods/Target Support Files/Pods-run-with-friends_iOS/" || true
          if rg -q ' -ObjC' "Pods/Target Support Files/Pods-run-with-friends_iOS/"*.xcconfig; then
            echo "error: -ObjC still present in Pods xcconfig; post_install failed"
            exit 1
          fi

      - name: Build Tauri iOS (release)
        run: npx tauri ios build --export-method app-store-connect
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}

      - name: Upload to TestFlight
        run: |
          BUILD_DIR="src-tauri/gen/apple/build/arm64"
          IPA="$(find "$BUILD_DIR" -maxdepth 1 -name '*.ipa' -print -quit 2>/dev/null || true)"
          if [ -z "$IPA" ]; then
            IPA="$(find src-tauri/gen/apple/build -name '*.ipa' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "No IPA found under src-tauri/gen/apple/build"
            find src-tauri/gen/apple/build -type f 2>/dev/null || true
            exit 1
          fi
          # Xcode may overwrite CFBundleVersion with marketing version / empty; stamp + re-sign.
          IPA_ABS="$(cd "$(dirname "$IPA")" && pwd)/$(basename "$IPA")"
          WORK="$(mktemp -d)"
          unzip -q "$IPA_ABS" -d "$WORK"
          APP="$(find "$WORK/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP/Info.plist" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$APP/Info.plist"
          echo "IPA CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          DIST_ID="$(security find-identity -v -p codesigning | awk -F'"' '/Apple Distribution/{print $2; exit}')"
          if [ -z "$DIST_ID" ]; then
            echo "No Apple Distribution identity"
            security find-identity -v -p codesigning
            exit 1
          fi
          cp "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision" \
            "$APP/embedded.mobileprovision"
          ENTS="$(mktemp).plist"
          codesign -d --entitlements :- "$APP" > "$ENTS" 2>/dev/null || \
            cp src-tauri/gen/apple/run-with-friends_iOS/run-with-friends_iOS.entitlements "$ENTS"
          while IFS= read -r -d '' item; do
            codesign --force --sign "$DIST_ID" --timestamp "$item"
          done < <(find "$APP" \( -name '*.framework' -o -name '*.dylib' \) -print0)
          codesign --force --sign "$DIST_ID" --entitlements "$ENTS" --timestamp "$APP"
          rm -f "$ENTS"
          rm -f "$IPA_ABS"
          (cd "$WORK" && zip -qr "$IPA_ABS" Payload)
          rm -rf "$WORK"
          echo "Uploading $IPA_ABS"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_ABS" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Notify success
        if: success()
        run: echo "Build ${{ env.BUILD_NUMBER }} successfully uploaded to TestFlight."

      - name: Notify failure
        if: failure()
        run: echo "TestFlight deployment failed. Check the logs above."
