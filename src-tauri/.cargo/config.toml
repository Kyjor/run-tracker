# Local fallback for Rust/Xcode clang_rt.ios mismatch (Xcode 26+ / clang 21).
# CI overwrites this file by detecting the runner's clang darwin lib path.
# Prefer `rustup update stable` when possible.
[target.aarch64-apple-ios]
rustflags = [
  "-C", "link-arg=-L/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/21.0.0/lib/darwin",
]

[target.aarch64-apple-ios-sim]
rustflags = [
  "-C", "link-arg=-L/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/21.0.0/lib/darwin",
]

[target.x86_64-apple-ios]
rustflags = [
  "-C", "link-arg=-L/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/21.0.0/lib/darwin",
]
