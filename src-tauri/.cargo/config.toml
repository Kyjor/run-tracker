# Rust 1.87 expects compiler-rt under clang/17; Xcode 26+ only ships clang/21.
# Point the linker at the installed runtime until rustc is updated (rustup update stable).
[target.aarch64-apple-ios]
rustflags = [
  "-C", "link-arg=-L/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/21.0.0/lib/darwin",
]

[target.aarch64-apple-ios-sim]
rustflags = [
  "-C", "link-arg=-L/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/21.0.0/lib/darwin",
]

[target.x86_64-apple-ios]
rustflags = [
  "-C", "link-arg=-L/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/21.0.0/lib/darwin",
]
