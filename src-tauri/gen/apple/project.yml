name: run-with-friends
options:
  bundleIdPrefix: com.runwithfriends.app
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Run 4 Fun
      PRODUCT_BUNDLE_IDENTIFIER: com.runwithfriends.app
      DEVELOPMENT_TEAM: AKG5NATH99
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  run-with-friends_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Native bridges live at apple root (not under Sources/); must stay in the
      # target or Rust @_cdecl imports fail at final link.
      - path: HealthKitBridge.swift
      - path: LocationTrackingBridge.swift
      - path: HRMBridge.swift
      - path: AdBannerBridge.swift
      - path: IapBridge.swift
      - path: Assets.xcassets
      # Link via LIBRARY_SEARCH_PATHS + dependencies; do not copy .a into the app bundle.
      - path: Externals
        buildPhase: none
        excludes:
          - "**/*"
      - path: run-with-friends_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: run-with-friends_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: "0.6.4"
        CFBundleVersion: "3"
        # Required — GoogleMobileAds crashes on launch without this key.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        NSHealthShareUsageDescription: Run 4 Fun reads your workouts to import runs and health metrics.
        NSHealthUpdateUsageDescription: Run 4 Fun can write runs back to Apple Health.
        NSLocationWhenInUseUsageDescription: We use your location to track runs and show your GPS route.
        NSLocationAlwaysAndWhenInUseUsageDescription: We use your location to reliably track runs even when the app is not in the foreground.
        NSBluetoothAlwaysUsageDescription: Run 4 Fun connects to Bluetooth heart rate monitors during live runs.
        NSBluetoothPeripheralUsageDescription: Run 4 Fun connects to Bluetooth heart rate monitors during live runs.
        UIBackgroundModes: [location]
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: FIT Workout File
            LSHandlerRank: Owner
            LSItemContentTypes: [com.runwithfriends.fit]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.runwithfriends.fit
            UTTypeDescription: FIT Workout File
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fit]
              public.mime-type: application/octet-stream
    entitlements:
      path: run-with-friends_iOS/run-with-friends_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: "0.6.3"
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        # Non-arch-specific path required: Xcode 26 drops LIBRARY_SEARCH_PATHS[arch=*] for -lapp.
        # Use XcodeDefault explicitly — TOOLCHAIN_DIR can point at Metal.xctoolchain on CI.
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: HealthKit.framework
      - sdk: CoreLocation.framework
      - sdk: StoreKit.framework
      - sdk: CoreBluetooth.framework
    preBuildScripts:
      # Omit FORCE_COLOR: when set to 0 it is parsed as an invalid arch.
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a